<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nivelacion-Manejo del DOM</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        input {
            padding: 10px;
            font-size: 16px;
            width: 250px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            display: block;
            margin: 0 auto;
        }
        .estado-0 { background-color: white; color: black; }
        .estado-1 { background-color: black; color: white; }
        .estado-2 { background-color:  #87CEEB; color: red; }
    </style>

</head>
<body class="estado-0">

    <div class="container">
        <h1>Mi Sitio Interactivo</h1>
        <input type="text" id="cajaTexto" placeholder="Escribe algo y presiona Enter.">
        <button id="btnCambiarColor">Cambiar Colores</button>
    </div>

    <script>
        const cajaTexto = document.getElementById('cajaTexto');
        const btnColor = document.getElementById('btnCambiarColor');
        const cuerpo = document.body;


        cajaTexto.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const valor = cajaTexto.value;
                if (valor.trim() !== "") {
                    alert("Texto ingresado: " + valor);
                } else {
                    alert("La caja está vacía.");
                }
            }
        });

        let indiceEstado = 0;
        const totalEstados = 3;

        btnColor.addEventListener('click', () => {
            cuerpo.classList.remove(`estado-${indiceEstado}`);
            
            indiceEstado = (indiceEstado + 1) % totalEstados;
            
            cuerpo.classList.add(`estado-${indiceEstado}`);
        });
    </script>
</body>
</html>
